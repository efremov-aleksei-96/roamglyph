MaintainerNotes: |-
  This is the pre-release 0.5.0 source-build recipe used to validate F-Droid
  compatibility before the public release tag.

  The runtime deliberately excludes Google Play Services, Firebase, advertising,
  and analytics SDKs.

  com.uber:h3-android is Apache-2.0 FLOSS published through Maven Central. Its AAR
  contains native Android libraries. Reviewers should verify that dependency
  against the trusted-Maven/prebuilt-FLOSS policy rather than adding scanignore.

  The default online basemap uses the FLOSS OpenFreeMap service and MapLibre.
  Exploration history is local and does not depend on that service.

