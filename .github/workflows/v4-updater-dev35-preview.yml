name: Signed V4 and updater dev.35 preview

# One-off, source-pinned preview. Publish verified in-app prerelease.
# Push fires only when this trusted main-branch workflow itself is added/changed.
on:
  push:
    branches: [main]
    paths: [.github/workflows/v4-updater-dev35-preview.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-pr41-dev35-release
  cancel-in-progress: false

jobs:
  build-unsigned:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: e996779f31aae7aeef87f4c2695e4e916d87e231
      BASE_SHA: 243532d9116e6ee20c7c6f22da3fa8add53d69c3
      ROAMGLYPH_SOURCE_SHA: e996779f31aae7aeef87f4c2695e4e916d87e231
    steps:
      - name: Check out trusted main workflow repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require exact previously CI-tested PR41 source and safe diff
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch origin "$CANDIDATE_SHA"
          git cat-file -e "$CANDIDATE_SHA^{commit}"
          git merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"
          test "$(git rev-parse "$CANDIDATE_SHA")" = "$CANDIDATE_SHA"
          # Reject any changed scripts, CI workflows, Gradle code or other files.
          EXPECTED="$(printf '%s\n' \
            'app/src/main/java/com/sensareth/roamglyph/map/FogOrganicContour.java' \
            'app/src/main/java/com/sensareth/roamglyph/map/FogOrganicRaster.java' \
            'app/src/test/java/com/sensareth/roamglyph/map/FogOrganicContourTest.java' \
            'app/src/main/java/com/sensareth/roamglyph/map/FogGpsCorridors.java' \
            'app/src/main/java/com/sensareth/roamglyph/map/FogOverlayView.java' \
            'app/src/main/java/com/sensareth/roamglyph/map/FogTileQueuePriority.java' \
            'app/src/test/java/com/sensareth/roamglyph/map/FogTileQueuePriorityTest.java' \
            'app/src/main/java/com/sensareth/roamglyph/MainActivity.java' \
            'app/src/main/java/com/sensareth/roamglyph/updates/AppUpdateManager.java' \
            'app/src/main/java/com/sensareth/roamglyph/updates/UpdateDownloadRecord.java' \
            'app/src/main/res/xml/update_file_paths.xml' \
            'app/src/test/java/com/sensareth/roamglyph/updates/UpdateDownloadRecordTest.java' | sort)"
          ACTUAL="$(git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Candidate differs outside twelve reviewed V4/updater files."
            git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA"
            exit 1
          fi
          git checkout --detach "$CANDIDATE_SHA"

      - name: Prepare isolated dev.35 preview with no embedded signing key
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          data = p.read_text()
          changes = (
              ('versionCode = 32', 'versionCode = 35'),
              ('versionName = "0.5.0-dev.32+g$devRevision"',
               'versionName = "0.5.0-dev.35+g$devRevision"'),
              ('getByName("debug") {\n            if (hasDevSigning)',
               'getByName("debug") {\n            signingConfig = null\n            if (hasDevSigning)'),
          )
          for before, after in changes:
              if data.count(before) != 1:
                  raise SystemExit(f"Unexpected preview version/build configuration: {before}")
              data = data.replace(before, after)
          p.write_text(data)
          PY
          test -z "${ROAMGLYPH_DEV_KEYSTORE:-}"
          test -z "${ROAMGLYPH_DEV_KEYSTORE_PASSWORD:-}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 platform
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Retest and build unsigned preview, without secrets
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          mkdir -p unsigned
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*unsigned.apk' -type f | head -n 1)"
          test -n "$APK" && test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          if "$APKSIGNER" verify "$APK" >/dev/null 2>&1; then
            echo "::error::Build artifact was already signed; refuse to pass it to signing job."
            exit 1
          fi
          cp "$APK" unsigned/roamglyph-pr41-dev35-unsigned.apk

      - name: Transfer unsigned preview to isolated signing job
        uses: actions/upload-artifact@v4
        with:
          name: pr41-dev35-unsigned-intermediate
          path: unsigned/roamglyph-pr41-dev35-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  sign-preview:
    needs: build-unsigned
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Critical: never checkout or execute candidate code in this secret-bearing job.
    steps:
      - name: Download verified unsigned APK only
        uses: actions/download-artifact@v4
        with:
          name: pr41-dev35-unsigned-intermediate
          path: unsigned

      - name: Set up signing and Android build tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify metadata, sign, and pin existing Pixel development certificate
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ROAMGLYPH_DEV_KEYSTORE_BASE64 }}
          ROAMGLYPH_DEV_KEYSTORE_PASSWORD: ${{ secrets.ROAMGLYPH_DEV_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE="$RUNNER_TEMP/roamglyph-pr41-dev-signing.p12"
          trap 'rm -f "$KEYSTORE"' EXIT
          test -n "$KEYSTORE_BASE64" && test -n "$ROAMGLYPH_DEV_KEYSTORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER" && test -x "$AAPT"
          INPUT=unsigned/roamglyph-pr41-dev35-unsigned.apk
          test -s "$INPUT"
          BADGING="$("$AAPT" dump badging "$INPUT" | head -n 1)"
          [[ "$BADGING" == *"name='com.sensareth.roamglyph'"* ]]
          [[ "$BADGING" == *"versionCode='35'"* ]]
          [[ "$BADGING" == *"versionName='0.5.0-dev.35+ge996779f'"* ]]
          if "$APKSIGNER" verify "$INPUT" >/dev/null 2>&1; then
            echo "::error::Refusing an already signed candidate."
            exit 1
          fi
          KEY_DIGEST="$(keytool -exportcert -rfc -storetype PKCS12 \
            -keystore "$KEYSTORE" \
            -storepass "$ROAMGLYPH_DEV_KEYSTORE_PASSWORD" \
            -alias roamglyph-dev | openssl x509 -noout -fingerprint -sha256 |
            sed 's/.*=//' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          PIN=89defa011682172a6d892cda46cd6132393dccda22cecf1175f825596db80758
          test "$KEY_DIGEST" = "$PIN" || {
            echo "::error::Signing certificate differs from installed Pixel dev channel."
            exit 1
          }
          mkdir -p dist
          OUTPUT=dist/roamglyph-0.5.0-dev.35-ge996779f.apk
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-type PKCS12 \
            --ks-key-alias roamglyph-dev \
            --ks-pass env:ROAMGLYPH_DEV_KEYSTORE_PASSWORD \
            --key-pass env:ROAMGLYPH_DEV_KEYSTORE_PASSWORD \
            --out "$OUTPUT" "$INPUT"
          "$APKSIGNER" verify --verbose "$OUTPUT"
          APK_DIGEST="$("$APKSIGNER" verify --print-certs "$OUTPUT" |
            sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)"
          test "$APK_DIGEST" = "$PIN"
          (cd dist && sha256sum roamglyph-*.apk > SHA256SUMS.txt)

      - name: Upload signed Pixel APK for in-app development update test
        uses: actions/upload-artifact@v4
        with:
          name: roamglyph-pr41-dev35-pixel-preview-signed
          path: |
            dist/roamglyph-0.5.0-dev.35-ge996779f.apk
            dist/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error

  publish-dev35:
    name: Publish signed dev35 to developer updates
    needs: sign-preview
    if: github.repository == 'efremov-aleksei-96/roamglyph' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: e996779f31aae7aeef87f4c2695e4e916d87e231
      RELEASE_TAG: dev-vc35-ge996779f
      APK_NAME: roamglyph-0.5.0-dev.35-ge996779f.apk
      PIN: 89defa011682172a6d892cda46cd6132393dccda22cecf1175f825596db80758
    steps:
      - name: Get certified APK, not candidate code
        uses: actions/download-artifact@v4
        with:
          name: roamglyph-pr41-dev35-pixel-preview-signed
          path: dist

      - name: Verify release bytes, key and fixed source
        shell: bash
        run: |
          set -euo pipefail
          test -s "dist/$APK_NAME" && test -s dist/SHA256SUMS.txt
          (cd dist && sha256sum -c SHA256SUMS.txt)
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "dist/$APK_NAME"
          CERT="$("$APKSIGNER" verify --print-certs "dist/$APK_NAME" |
            sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)"
          test "$CERT" = "$PIN"
          PR_HEAD="$(gh api "repos/$GITHUB_REPOSITORY/pulls/41" --jq '.head.sha')"
          test "$PR_HEAD" = "$SOURCE_SHA"
          # Enforce the acceptance gates in the job that has permission to
          # publish. A healthy workflow PR is not proof that candidate PR #41
          # passed CI and emulator smoke on its exact immutable commit.
          CANDIDATE_RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&event=pull_request&per_page=100")"
          for CHECK in "Android CI" "Android Runtime Smoke"; do
            jq -e --arg sha "$SOURCE_SHA" --arg name "$CHECK" '
              [.workflow_runs[] |
               select(.head_sha == $sha and .name == $name
                      and .status == "completed"
                      and .conclusion == "success")] | length > 0
            ' <<<"$CANDIDATE_RUNS" >/dev/null || {
              echo "::error::Candidate commit has no successful $CHECK PR run."
              exit 1
            }
          done
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists; refuse replacement."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag already exists; refuse replacement."
            exit 1
          fi

      - name: Publish immutable V4 and background-update test prerelease
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" "dist/$APK_NAME" dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --prerelease --latest=false \
            --title "RoamGlyph 0.5.0-dev.35 (V4 and background-update test)" \
            --notes "Experimental combined preview: retains V4 from PR #36 and tile/GPS performance from PR #39, and adds PR #41 persistent Android DownloadManager updater. Renderer V1 remains default; candidate code is NOT merged into main. Pixel acceptance of V4 performance and background-download recovery is pending. Stop Exploration and export a full JSON backup before updating dev.34 in place. Test background downloads with the NEXT update and compare V4 queue latency, fog loading, and geometric integrity."

      - name: Verify public prerelease is detectable by in-app updater
        shell: bash
        run: |
          set -euo pipefail
          RELEASE="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          DIGEST="sha256:$(sha256sum "dist/$APK_NAME" | cut -d' ' -f1)"
          jq -e --arg name "$APK_NAME" --arg digest "$DIGEST" \
            '(.draft == false and .prerelease == true) and
             ([.assets[] | select(.name == $name and .digest == $digest
               and (.browser_download_url | startswith("https://github.com/")))]
              | length == 1)' <<<"$RELEASE" >/dev/null
          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$TAG_SHA" = "$SOURCE_SHA"
          echo "Verified: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
