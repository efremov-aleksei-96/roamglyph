name: Android CI

on:
  push:
    branches: [ main, oss-readiness-v0.5.0 ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ROAMGLYPH_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Never upload a CI-runner-generated ephemeral debug certificate.
      # PRs still run normal builds without access to signing secrets.
      ROAMGLYPH_REQUIRE_DEV_KEYSTORE: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') && 'true' || 'false' }}
      ROAMGLYPH_DEV_KEYSTORE: /tmp/roamglyph-dev.p12
      ROAMGLYPH_DEV_KEYSTORE_PASSWORD: ${{ secrets.ROAMGLYPH_DEV_KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout exact advertised source revision
        uses: actions/checkout@v5
        with:
          # pull_request normally checks out a synthetic merge SHA.
          # The versionName and artifact must instead identify this exact tree.
          ref: ${{ env.ROAMGLYPH_SOURCE_SHA }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 platform
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Reject proprietary runtime SDKs
        shell: bash
        run: |
          gradle --no-daemon :app:dependencies --configuration debugRuntimeClasspath > runtime-deps.txt
          if grep -Eiq 'com\.google\.android\.gms|com\.google\.firebase|play-services|firebase|crashlytics|admob' runtime-deps.txt; then
            echo "Proprietary Google/Firebase runtime dependency detected."
            cat runtime-deps.txt
            exit 1
          fi

      - name: Reject committed signing keys
        shell: bash
        run: |
          if git ls-files | grep -Ei '\.(jks|keystore|p12|pfx)$'; then
            echo "Signing key material must not be committed."
            exit 1
          fi

      - name: Restore persistent development signing key (main only)
        if: env.ROAMGLYPH_REQUIRE_DEV_KEYSTORE == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ROAMGLYPH_DEV_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$ROAMGLYPH_DEV_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Persistent development signing is not configured. Run scripts/setup-dev-signing.ps1 locally to upload both GitHub Actions secrets."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ROAMGLYPH_DEV_KEYSTORE"
          keytool -list -storetype PKCS12 \
            -keystore "$ROAMGLYPH_DEV_KEYSTORE" \
            -storepass "$ROAMGLYPH_DEV_KEYSTORE_PASSWORD" \
            -alias roamglyph-dev >/dev/null

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Android lint
        run: gradle --no-daemon :app:lintDebug

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Test injected development signing without publishing a throwaway key
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          ROAMGLYPH_DEV_KEYSTORE: /tmp/roamglyph-ci-test.p12
          ROAMGLYPH_DEV_KEYSTORE_PASSWORD: ci-test-key-never-distribute
          ROAMGLYPH_REQUIRE_DEV_KEYSTORE: 'true'
        run: |
          umask 077
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$ROAMGLYPH_DEV_KEYSTORE" \
            -storepass "$ROAMGLYPH_DEV_KEYSTORE_PASSWORD" \
            -keypass "$ROAMGLYPH_DEV_KEYSTORE_PASSWORD" \
            -alias roamglyph-dev -keyalg RSA -keysize 2048 -validity 7 \
            -dname "CN=CI Only Test Certificate, O=RoamGlyph, C=AM"
          gradle --no-daemon :app:assembleDebug --rerun-tasks
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk |
            grep -q 'Signer #1 certificate SHA-256 digest:'
          rm -f "$ROAMGLYPH_DEV_KEYSTORE"

      - name: Build unsigned release for F-Droid compatibility
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify exact persistent signing certificate before distribution
        if: env.ROAMGLYPH_REQUIRE_DEV_KEYSTORE == 'true'
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$APKSIGNER" verify --verbose "$APK"
          APK_DIGEST="$("$APKSIGNER" verify --print-certs "$APK" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          KEY_DIGEST="$(keytool -exportcert -rfc -storetype PKCS12 \
            -keystore "$ROAMGLYPH_DEV_KEYSTORE" \
            -storepass "$ROAMGLYPH_DEV_KEYSTORE_PASSWORD" \
            -alias roamglyph-dev | openssl x509 -noout -fingerprint -sha256 |
            sed 's/.*=//' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$APK_DIGEST" && test "$APK_DIGEST" = "$KEY_DIGEST" || {
            echo "::error::APK signing certificate does not match the persistent development keystore."
            exit 1
          }
          echo "Verified persistent development certificate SHA-256: $APK_DIGEST"

      - name: Label persistently signed development APK with source revision
        if: env.ROAMGLYPH_REQUIRE_DEV_KEYSTORE == 'true'
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            "dist/roamglyph-0.5.0-dev.25-g${ROAMGLYPH_SOURCE_SHA:0:8}.apk"

      - name: Upload verified updateable development APK
        if: env.ROAMGLYPH_REQUIRE_DEV_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: roamglyph-dev25-signed-apk
          path: dist/roamglyph-0.5.0-dev.25-g*.apk
          if-no-files-found: error
